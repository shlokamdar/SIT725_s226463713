<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SIT725 3.2P - Recipe Box</title>
  <meta name="description" content="SIT725 Task 3.2P - Getting Graphical (Recipe domain)">
  <meta name="author" content="Shloka Kamdar">

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Style Sheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav>
    <div class="nav-wrapper navbar-size">
      <a href="#!" class="brand-logo left"><i class="material-icons left">restaurant_menu</i>Shlo's Recipe Box</a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a target="_blank" href="https://github.com/shlokamdar/SIT725_s226463713">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="main-body">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 id="heading">Shloka's Recipe Box</h1>
          <p class="flow-text">A small recipe catalogue built with Express and Materialize. The cards below are
            <strong>not</strong> hardcoded &dash; they are fetched live from a GET REST endpoint
            (<code>GET /api/recipes</code>) served by the Express app.</p>
        </div>
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn click-me-button modal-trigger" id="clickMeButton" data-target="modal1">
            <i class="material-icons left">restaurant_menu</i>Suggest a Recipe
          </a>
        </div>
      </div>

      <!-- Recipe cards get appended here by js/scripts.js after GET /api/recipes resolves -->
      <div class="row" id="card-section"></div>
    </div>

    <!-- Modal Structure -->
    <div id="modal1" class="modal modal-fixed-footer">
      <div class="row modal-content">
        <form class="col s12" id="suggestForm">
          <div class="row">
            <div class="input-field col s6">
              <input placeholder="Placeholder" id="first_name" type="text" class="validate">
              <label for="first_name">Your Name</label>
            </div>
            <div class="input-field col s6">
              <input id="recipe_name" type="text" class="validate">
              <label for="recipe_name">Recipe Name</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <input id="email" type="email" class="validate">
              <label for="email">Email</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12 center-align">
              <a class="waves-effect waves-light btn" id="formSubmit">Submit</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!--  JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
